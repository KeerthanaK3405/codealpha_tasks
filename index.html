<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="gallery">
        <!-- Main Image Display -->
        <div class="main-image">
            <img id="main-img" src="C:\project2\gallery.jpg" alt="Gallery Image" width="50px">
            <button id="prev-btn" class="nav-btn">&#10094;</button>
            <button id="next-btn" class="nav-btn">&#10095;</button>
        </div>

        <!-- Thumbnails -->
        <div class="thumbnails">
            <img src="C:\project2\image1.jpg" alt="Thumbnail 1" class="thumbnail active" data-index="0">
            <img src="C:\project2\image2.jpg" alt="Thumbnail 2" class="thumbnail" data-index="1">
            <img src="C:\project2\image3.jpg" alt="Thumbnail 3" class="thumbnail" data-index="2">
            <img src="C:\project2\image4.jpg" alt="Thumbnail 4" class="thumbnail" data-index="3">
            <img src="C:\project2\image5.jpg" alt="Thumbnail 5" class="thumbnail" data-index="4">
          
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
